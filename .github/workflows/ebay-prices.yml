name: eBay prices

# Every 15 minutes: prices tools that were just added, and refreshes any price older than 3 hours
# (official eBay Browse API), shown on each tool card. Most runs only look up a handful of tools.
# Does nothing until the eBay keys are added (see README, "eBay prices").
on:
  schedule:
    - cron: "7,22,37,52 * * * *" # every 15 minutes (GitHub may start it a little late)
  workflow_dispatch:
    inputs:
      parts:
        description: "Only these part numbers (space separated); empty = all"
        default: ""
      flags:
        description: "Extra flags, e.g. --dry-run --explain"
        default: ""

concurrency:
  group: ebay-prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ebay:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      SUPABASE_URL: https://ctteljhhjsfvyyiwzxiy.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look up eBay prices
        env:
          PARTS: ${{ inputs.parts }}
          FLAGS: ${{ inputs.flags }}
        # PARTS/FLAGS are split into words on purpose; only the repo owner can start a run by hand
        run: node checker/ebay.mjs $PARTS $FLAGS
