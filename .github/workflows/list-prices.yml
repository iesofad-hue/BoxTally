name: Snap-on list prices

# Every 15 minutes, looks up the Snap-on list price for new tools (Gemini with Google Search, kept only
# when a snapon.com page backs it), so a new tool gets its price within about 15 minutes. Prices are
# rechecked twice a year; the owner's own prices are never overwritten. Most runs find nothing to do.
# Does nothing until GEMINI_API_KEY is added (see README, "Snap-on list prices").
on:
  schedule:
    - cron: "4,19,34,49 * * * *" # every 15 minutes (GitHub may start it a little late)
  workflow_dispatch:
    inputs:
      parts:
        description: "Only these part numbers (space separated); empty = all that are due"
        default: ""
      flags:
        description: "Extra flags, e.g. --dry-run"
        default: ""

concurrency:
  group: list-prices
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://ctteljhhjsfvyyiwzxiy.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAX_LOOKUPS: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look up Snap-on list prices
        env:
          PARTS: ${{ inputs.parts }}
          FLAGS: ${{ inputs.flags }}
        # PARTS/FLAGS are split into words on purpose; only the repo owner can start a run by hand
        run: node checker/list-prices.mjs $PARTS $FLAGS
