name: Checks

# On every change pushed to GitHub: runs the part number and eBay matching tests, then opens the site
# in a hidden browser (phone and desktop size) and loads the sample box. If anything fails, GitHub emails
# the repo owner. The site still publishes either way; this is the early warning.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Part numbers
        run: node checker/part-numbers.test.mjs
      - name: File versions
        run: node checker/versions.test.mjs
      - name: Part-number pages are up to date
        # t/ and sitemap.xml are made by checker/tool-pages.mjs; this fails if someone forgot to run it
        run: node checker/tool-pages.mjs && git diff --exit-code --stat -- t sitemap.xml && test -z "$(git status --porcelain -- t sitemap.xml)"
      - name: eBay matching
        run: node checker/ebay-match.test.mjs
      - name: Color versions share a price
        run: node checker/color-family.test.mjs
      - name: Instant price lookup is up
        # supabase/functions/price-now answers a caller who isn't signed in with 401 "Sign in first."
        # Anything else (a crash on start, a missing function) fails this check.
        run: |
          out=$(curl -s -o /tmp/pn.json -w "%{http_code}" -X POST https://ctteljhhjsfvyyiwzxiy.supabase.co/functions/v1/price-now \
            -H "apikey: sb_publishable_y4-sxz8INJZu3fU6xIwWLw_9krKIQJb" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0dGVsamhoanNmdnl5aXd6eGl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODM1MjYsImV4cCI6MjEwNzI1OTUyNn0.VI-abS_YtTGYnJ7eo18B4JsOG35z3cRjScM8PB1NiHA" \
            -H "Content-Type: application/json" -d '{"pns":["F80"]}')
          echo "HTTP $out: $(cat /tmp/pn.json)"
          [ "$out" = "401" ] && grep -q "Sign in first" /tmp/pn.json
      - name: Install a hidden browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Open the site and load the sample box
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1
          node checker/smoke.test.mjs
